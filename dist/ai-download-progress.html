<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Elleson Studio · Work in progress</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101115;color:#ececf4;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(740px,100%);background:#191b22;border:1px solid #353844;border-radius:18px;padding:34px}small{color:#aaa2d3;letter-spacing:2px}h1{font-size:25px;margin:13px 0 20px}.count{font-size:64px;font-weight:650;letter-spacing:-3px}.muted{color:#aeb2c1}p{line-height:1.6}#current{border-left:3px solid #a18aff;padding:12px 16px;background:#23212d;border-radius:0 8px 8px 0}ul{padding:0;list-style:none;margin:24px 0}li{display:flex;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid #30323c}.box{flex:none;border:1px solid #656979;width:17px;height:17px;border-radius:4px}.active .box{background:#a18aff;border-color:#a18aff;animation:pulse 1.4s infinite}.active{color:#d6caff}#updated{font-size:12px;color:#858a9c}a{color:#c5b7ff}@keyframes pulse{50%{opacity:.35}}</style>
<main><small>ELLESON STUDIO</small><h1>What I’m working on</h1><div><span class="count" id="number">—</span> <span class="muted">tasks still unfinished</span></div><p id="current" role="status">Reading the current work…</p><ul id="tasks"></ul><p id="elapsed" class="muted"></p><p id="updated">Updates automatically every 2 seconds.</p><a href="/">Open the editor preview</a></main>
<script>
let last;function elapsed(){const seconds=last?.currentStartedAt?Math.max(0,Math.floor((Date.now()-new Date(last.currentStartedAt))/1000)):0;document.querySelector('#elapsed').textContent=last?.tasks.some(t=>t.state==='active')&&last.currentStartedAt?'Current step running: '+Math.floor(seconds/60)+'m '+String(seconds%60).padStart(2,'0')+'s':''}setInterval(elapsed,1000);
async function update(){try{const response=await fetch('/work-progress.json?now='+Date.now(),{cache:'no-store'});if(!response.ok)throw Error();const p=await response.json(),pending=p.tasks.filter(t=>t.state!=='done');last=p;elapsed();document.querySelector('#number').textContent=pending.length;document.querySelector('#current').textContent=p.current;const list=document.querySelector('#tasks');list.replaceChildren(...pending.map(task=>{const li=document.createElement('li'),box=document.createElement('span'),label=document.createElement('span');li.className=task.state==='active'?'active':'';box.className='box';box.setAttribute('aria-hidden','true');label.textContent=task.label+(task.state==='active'?' · working now':task.state==='blocked'?' · needs a fix':'');li.append(box,label);return li}));document.querySelector('#updated').textContent='Last work update: '+new Date(p.updatedAt).toLocaleTimeString()+' · checks for changes every 2 seconds. Finished tasks disappear from this list.'}catch{document.querySelector('#updated').textContent=last?'Connection lost. Last known work is shown; reconnecting…':'The live work feed is unavailable. This page will retry automatically.'}}
update();setInterval(update,2000);
</script></html>
